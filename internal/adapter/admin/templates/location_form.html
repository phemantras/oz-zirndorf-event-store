{{define "title"}}{{.Heading}}{{end}}
{{define "head"}}
<link rel="stylesheet" href="/admin/static/leaflet/leaflet.css">
<script src="/admin/static/leaflet/leaflet.js" defer></script>
<script src="/admin/static/location-map.js" defer></script>
{{end}}
{{define "content"}}
<p><a href="/admin/locations">Zurück zur Ortsliste</a></p>
<h1>{{.Heading}}</h1>
{{with .Conflict}}<p class="error" role="alert">{{.Message}} <a href="{{.URL}}">{{.Name}}</a></p>{{end}}
<form method="post" action="{{.Action}}" novalidate>
{{template "locationFields" .Fields}}
  <button type="submit">Speichern</button>
</form>
{{end}}
